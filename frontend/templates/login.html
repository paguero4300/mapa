{{template "layout.html" .}}

{{define "content"}}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-gray-50 to-gray-100">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <!-- Logo/Icon mejorado -->
            <div class="mx-auto h-16 w-16 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg mb-6 transform transition-transform duration-300 hover:scale-105">
                <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-center text-3xl font-bold text-gray-900 mb-2">
                Bienvenido
            </h2>
            <p class="text-center text-sm text-gray-600">
                Inicia sesión para acceder al sistema
            </p>
        </div>
        
        <!-- FORMULARIO MEJORADO -->
        <div class="mt-8">
            <form id="loginForm" class="space-y-6">
                <div class="bg-white rounded-xl shadow-lg p-8 space-y-6">
                    <div class="space-y-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                                    </svg>
                                </div>
                                <input
                                    id="email"
                                    name="email"
                                    type="email"
                                    autocomplete="email"
                                    required
                                    class="appearance-none relative block w-full pl-10 pr-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition-all duration-200"
                                    placeholder="tu@email.com"
                                >
                            </div>
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                    </svg>
                                </div>
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                    class="appearance-none relative block w-full pl-10 pr-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition-all duration-200"
                                    placeholder="••••••••"
                                >
                            </div>
                        </div>
                    </div>
                </div>

                <div id="errorMessage" class="text-red-500 text-sm text-center hidden"></div>
                
                <div>
                    <button
                        type="submit"
                        id="loginButton"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform transition-all duration-200 hover:scale-[1.02] active:scale-[0.98] shadow-lg"
                    >
                        <span id="buttonText" class="flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                            </svg>
                            Iniciar Sesión
                        </span>
                        <span id="loadingText" class="flex items-center hidden">
                            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Iniciando sesión...
                        </span>
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="text-center">
            <p class="text-xs text-gray-500">
                Sistema de seguimiento GPS Traccar
            </p>
        </div>
    </div>
</div>

<script>
// Verificar si ya está autenticado al cargar la página (SOLO EN LOGIN)
document.addEventListener('DOMContentLoaded', function() {
    // IMPORTANTE: Solo ejecutar en la página de login
    if (window.location.pathname !== '/' && window.location.pathname !== '/login') {
        console.log('🚫 [LOGIN PAGE] No estamos en página de login, omitiendo verificación');
        return;
    }
    
    console.log('🚀 [LOGIN PAGE] Verificando estado de autenticación');
    
    // Verificar sessionStorage
    const userData = sessionStorage.getItem('userData');
    if (userData) {
        console.log('💾 [LOGIN PAGE] Datos de usuario encontrados en sessionStorage');
        try {
            const user = JSON.parse(userData);
            console.log('👤 [LOGIN PAGE] Usuario:', user.name);
            
            // Verificar sesión con el servidor
            fetch('/api/session', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => {
                if (response.ok) {
                    console.log('✅ [LOGIN PAGE] Sesión válida, redirigiendo al dashboard');
                    window.location.href = '/dashboard';
                } else {
                    console.log('❌ [LOGIN PAGE] Sesión expirada, limpiando datos');
                    sessionStorage.removeItem('userData');
                }
            })
            .catch(error => {
                console.error('❌ [LOGIN PAGE] Error verificando sesión:', error);
                sessionStorage.removeItem('userData');
            });
        } catch (error) {
            console.error('❌ [LOGIN PAGE] Error parseando datos:', error);
            sessionStorage.removeItem('userData');
        }
    }
});

// JavaScript SIMPLE - KISS (SOLO EN LOGIN)
// Función para sanitizar inputs
function sanitizeInput(input) {
    return input.trim().replace(/[<>]/g, '');
}

const loginForm = document.getElementById('loginForm');
if (loginForm) {
    loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    console.log('🚀 [LOGIN] Iniciando proceso de login');
    
    const email = sanitizeInput(document.getElementById('email').value);
    const password = sanitizeInput(document.getElementById('password').value);
    const button = document.getElementById('loginButton');
    const buttonText = document.getElementById('buttonText');
    const loadingText = document.getElementById('loadingText');
    const errorMessage = document.getElementById('errorMessage');
    
    console.log('📧 [LOGIN] Email:', email);
    
    // Mostrar loading
    button.disabled = true;
    buttonText.classList.add('hidden');
    loadingText.classList.remove('hidden');
    errorMessage.classList.add('hidden');
    errorMessage.textContent = '';
    
    try {
        console.log('📡 [LOGIN] Enviando request a /api/login');
        
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify({ email, password })
        });
        
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || `HTTP ${response.status}`);
        }
        
        const data = await response.json();
        console.log('✅ [LOGIN] Login response recibida:', data);
        console.log('👤 [LOGIN] Usuario recibido:', data.user?.name, data.user?.email);
        
        // Guardar en sessionStorage
        sessionStorage.setItem('userData', JSON.stringify(data.user));
        console.log('💾 [LOGIN] Datos guardados en sessionStorage');
        
        // Mostrar éxito
        if (window.appUtils && window.appUtils.showNotification) {
            window.appUtils.showNotification('¡Login exitoso!', 'success');
        }
        
        console.log('🎉 [LOGIN] Login exitoso, redirigiendo al dashboard...');
        
        // Redirigir directamente al dashboard
        setTimeout(() => {
            console.log('🔄 [LOGIN] Redirigiendo al dashboard...');
            window.location.href = '/dashboard';
        }, 1500);
        
    } catch (err) {
        console.error('❌ [LOGIN] Error en login:', err);
        errorMessage.textContent = err.message || 'Error en el login';
        errorMessage.classList.remove('hidden');
        
        if (window.appUtils && window.appUtils.showNotification) {
            window.appUtils.showNotification(errorMessage.textContent, 'error');
        }
    } finally {
        // Restaurar botón
        button.disabled = false;
        buttonText.classList.remove('hidden');
        loadingText.classList.add('hidden');
        console.log('🏁 [LOGIN] Proceso de login finalizado');
    }
    });
} else {
    console.log('🚫 [LOGIN] Formulario de login no encontrado, omitiendo event listener');
}
</script>
{{end}}
