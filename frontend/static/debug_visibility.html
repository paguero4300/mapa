<!DOCTYPE html>\n<html>\n<head>\n    <title>Debug Visibility API</title>\n</head>\n<body>\n    <h1>Debug Visibility API</h1>\n    <button onclick=\"testVisibilityAPI()\">Test Visibility API</button>\n    <div id=\"result\"></div>\n\n    <script>\n    async function testVisibilityAPI() {\n        const resultDiv = document.getElementById('result');\n        \n        try {\n            // Primero probar obtener geocercas\n            console.log('Testing GET /api/geofences');\n            const getResponse = await fetch('/api/geofences', {\n                method: 'GET',\n                credentials: 'include'\n            });\n            \n            console.log('GET Response status:', getResponse.status);\n            \n            if (!getResponse.ok) {\n                throw new Error(`GET failed: ${getResponse.status} ${getResponse.statusText}`);\n            }\n            \n            const geofences = await getResponse.json();\n            console.log('Geofences:', geofences);\n            \n            if (geofences.geofences && geofences.geofences.length > 0) {\n                const firstGeofence = geofences.geofences[0];\n                console.log('Testing visibility update for geofence:', firstGeofence.id);\n                \n                // Probar actualizar visibilidad\n                const visibilityResponse = await fetch(`/api/geofences/${firstGeofence.id}/visibility`, {\n                    method: 'PUT',\n                    headers: {\n                        'Content-Type': 'application/json',\n                    },\n                    credentials: 'include',\n                    body: JSON.stringify({ visible: false })\n                });\n                \n                console.log('Visibility Response status:', visibilityResponse.status);\n                console.log('Visibility Response headers:', visibilityResponse.headers);\n                \n                if (!visibilityResponse.ok) {\n                    const errorText = await visibilityResponse.text();\n                    throw new Error(`Visibility update failed: ${visibilityResponse.status} ${visibilityResponse.statusText}\\nResponse: ${errorText}`);\n                }\n                \n                const visibilityResult = await visibilityResponse.json();\n                console.log('Visibility Result:', visibilityResult);\n                \n                resultDiv.innerHTML = `\n                    <h2>✅ Success!</h2>\n                    <p>GET /api/geofences: ${getResponse.status}</p>\n                    <p>PUT /api/geofences/${firstGeofence.id}/visibility: ${visibilityResponse.status}</p>\n                    <pre>${JSON.stringify(visibilityResult, null, 2)}</pre>\n                `;\n            } else {\n                resultDiv.innerHTML = '<h2>⚠️ No geofences found</h2>';\n            }\n            \n        } catch (error) {\n            console.error('Error:', error);\n            resultDiv.innerHTML = `\n                <h2>❌ Error</h2>\n                <p>${error.message}</p>\n            `;\n        }\n    }\n    </script>\n</body>\n</html>"
