<!DOCTYPE html>\n<html>\n<head>\n    <title>Test Visibility API</title>\n</head>\n<body>\n    <h1>Test Visibility API</h1>\n    \n    <h2>Test 1: Endpoint de Debug (sin autenticación)</h2>\n    <button onclick=\"testDebugEndpoint()\">Test Debug Endpoint</button>\n    <div id=\"debugResult\"></div>\n    \n    <h2>Test 2: Endpoint Real (con autenticación)</h2>\n    <button onclick=\"testRealEndpoint()\">Test Real Endpoint</button>\n    <div id=\"realResult\"></div>\n\n    <script>\n    async function testDebugEndpoint() {\n        const resultDiv = document.getElementById('debugResult');\n        \n        try {\n            console.log('Testing debug endpoint...');\n            \n            const requestBody = { visible: false };\n            console.log('Sending:', JSON.stringify(requestBody));\n            \n            const response = await fetch('/api/test-visibility/40', {\n                method: 'PUT',\n                headers: {\n                    'Content-Type': 'application/json',\n                },\n                body: JSON.stringify(requestBody)\n            });\n            \n            console.log('Response status:', response.status);\n            \n            if (!response.ok) {\n                const errorText = await response.text();\n                throw new Error(`${response.status}: ${errorText}`);\n            }\n            \n            const result = await response.json();\n            console.log('Result:', result);\n            \n            resultDiv.innerHTML = `\n                <h3>✅ Debug Test Success!</h3>\n                <p>Status: ${response.status}</p>\n                <pre>${JSON.stringify(result, null, 2)}</pre>\n            `;\n            \n        } catch (error) {\n            console.error('Debug test error:', error);\n            resultDiv.innerHTML = `\n                <h3>❌ Debug Test Failed</h3>\n                <p>${error.message}</p>\n            `;\n        }\n    }\n    \n    async function testRealEndpoint() {\n        const resultDiv = document.getElementById('realResult');\n        \n        try {\n            console.log('Testing real endpoint...');\n            \n            const requestBody = { visible: false };\n            console.log('Sending:', JSON.stringify(requestBody));\n            \n            const response = await fetch('/api/geofences/40/visibility', {\n                method: 'PUT',\n                headers: {\n                    'Content-Type': 'application/json',\n                },\n                credentials: 'include',\n                body: JSON.stringify(requestBody)\n            });\n            \n            console.log('Response status:', response.status);\n            \n            if (!response.ok) {\n                const errorText = await response.text();\n                throw new Error(`${response.status}: ${errorText}`);\n            }\n            \n            const result = await response.json();\n            console.log('Result:', result);\n            \n            resultDiv.innerHTML = `\n                <h3>✅ Real Test Success!</h3>\n                <p>Status: ${response.status}</p>\n                <pre>${JSON.stringify(result, null, 2)}</pre>\n            `;\n            \n        } catch (error) {\n            console.error('Real test error:', error);\n            resultDiv.innerHTML = `\n                <h3>❌ Real Test Failed</h3>\n                <p>${error.message}</p>\n            `;\n        }\n    }\n    </script>\n</body>\n</html>"
